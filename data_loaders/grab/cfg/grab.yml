# semi-supervised action transition max transition fn 75, dct smooth + last frame smooth, with extra future
dataset: grab
nz: 128
t_his: 25
t_pred: 60
lambda_v: 1000
beta: 0.01
vae_specs:
# rnn model
  model_name: v3_5_4
  rnn_type: gru
  x_birnn: false
  #e_birnn: false
  use_drnn_mlp: true
  is_layernorm: false

# dataset #default 4
  n_action: 4 # test pass action
  actions: [ "pass", "lift", "inspect", "drink" ]
  max_len: 501
  min_len: 100
  t_pre_extra: 50
  data_file: './dataset/grab_100_501_wact_candi_{}.npz'
  # change
  is_other_act: true 
  is_6d: true

# training
  lambdas: [ 100.0, 10.0, 10.0, 100.0 ]
  act_trans_k: 0.08
  max_trans_fn: 25
  smooth_N: 10
  dct_n: 5
vae_lr: 2.e-3
#128
batch_size: 32
num_vae_epoch: 500
num_vae_epoch_fix: 100
num_vae_data_sample: 1000
